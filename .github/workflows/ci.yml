name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        BUILD_TARGET: [release] # refers to a cargo profile
    outputs:
      release_built: ${{ steps.set-output.outputs.release_built }}

    steps:
    - uses: actions/checkout@v4
    - name: Check formatting
      run: cargo fmt --verbose --check
    - name: Clippy lint
      run: cargo check
    - name: Build (in ${{ matrix.BUILD_TARGET }} profile)
      run: cargo build --verbose --profile ${{ matrix.BUILD_TARGET }}
    - name: Run tests (in ${{ matrix.BUILD_TARGET }} profile)
      run: cargo test --verbose --profile ${{ matrix.BUILD_TARGET }}

    - name: Upload release artifact
      uses: actions/upload-artifact@v4
      with:
        name: vsto-${{ matrix.BUILD_TARGET }}
        path: target/${{ matrix.BUILD_TARGET }}