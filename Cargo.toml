[package]
name = "winky"
version = "0.1.1"
edition = "2021"
license-file = "LICENSE.txt"
authors = ["Benjamin Stolovitz <citelao>"]
description = "A simple CLI for accessing tools from Windows Kits (Windows SDKs)"
repository = "https://github.com/citelao/winky"

[dependencies]
clap = { version = "4.5.19", features = ["derive"] }
colored = "2.1.0"
thiserror = "1.0.64"

[dev-dependencies]
assert_fs = "1.1.2"
